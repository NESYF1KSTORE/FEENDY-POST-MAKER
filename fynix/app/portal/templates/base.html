<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FYNIX AI Pipeline{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #171a23; --panel-2: #1e222d; --line: #2a2f3d;
      --text: #e6e8ee; --muted: #9aa3b8; --accent: #6d4aff;
      --ok: #3ecf8e; --warn: #ffb020; --bad: #ff5c5c; --info: #4aa8ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7fb; --panel: #ffffff; --panel-2: #f0f2f7; --line: #dde1ea;
        --text: #14161d; --muted: #5b6478;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
      position: sticky; top: 0; z-index: 10;
    }
    header .brand { font-weight: 700; letter-spacing: .04em; }
    header .brand span { color: var(--accent); }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 28px 0 10px; color: var(--muted);
         text-transform: uppercase; letter-spacing: .06em; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 16px; margin-bottom: 14px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .muted { color: var(--muted); }
    .kpi { font-size: 26px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line);
             vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px;
         text-transform: uppercase; letter-spacing: .05em; }
    .scroll { overflow-x: auto; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px;
            font-size: 12px; font-weight: 600; background: var(--panel-2); color: var(--muted); }
    .pill.ok { background: rgba(62,207,142,.16); color: var(--ok); }
    .pill.warn { background: rgba(255,176,32,.16); color: var(--warn); }
    .pill.bad { background: rgba(255,92,92,.16); color: var(--bad); }
    .pill.info { background: rgba(74,168,255,.16); color: var(--info); }
    .bar { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--accent); }
    .btn { display: inline-block; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line);
           background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 14px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
    form.inline { display: inline-flex; gap: 6px; align-items: center; }
    input, select, textarea {
      background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
      border-radius: 7px; padding: 8px 10px; font: inherit; width: 100%;
    }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    pre { background: var(--panel-2); padding: 12px; border-radius: 8px; overflow-x: auto; }
    .empty { color: var(--muted); font-style: italic; padding: 10px 0; }
  </style>
</head>
<body>
<header>
  <div class="brand">FYNIX<span>·</span>AI PIPELINE</div>
  <nav>
    {% if principal %}
      <a href="/portal">Дашборд</a> &nbsp;
      <a href="/docs">API</a> &nbsp;
      <span class="muted">{{ principal.email }}</span> &nbsp;
      <a href="/portal/logout">Выйти</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
